<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3ecdf;color:#171614;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.side{background:#11110f;color:#fff;padding:22px 16px;display:flex;flex-direction:column}.brand{font:32px Georgia,serif;margin:4px 10px 28px}.nav button{width:100%;border:0;background:transparent;color:#bdbab4;padding:11px 12px;border-radius:12px;text-align:left;margin:3px 0}.nav button.on,.nav button:hover{background:#2b2a27;color:#fff}.me{margin-top:auto;padding:12px;border-top:1px solid #333;font-size:12px;color:#aaa}.main{padding:22px 28px}.top{display:flex;align-items:center;gap:14px}.search{flex:1;max-width:520px;border:1px solid #d8d0c4;background:#fbf7ef;border-radius:12px;padding:10px 12px}.sync{margin-left:auto;font-size:11px;color:#777}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:38px 0 18px}.hero h1{font:54px Georgia,serif;margin:0;letter-spacing:-2px}.hero p{margin:8px 0 0;color:#7c756b}.btn{border:0;border-radius:999px;padding:11px 16px;background:#171614;color:#fff;cursor:pointer}.ghost{background:#fff0;border:1px solid #cfc5b7;color:#171614}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.m{border-radius:18px;padding:18px;min-height:110px}.m b{font:34px Georgia,serif;display:block;margin-top:8px}.y{background:#f6d981}.p{background:#edb8cc}.g{background:#c6d6a9}.b{background:#bdd2ef}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}.card{background:#fbf7ef;border:1px solid #ddd4c7;border-radius:18px;padding:18px}.card h3{font:22px Georgia,serif;margin:0 0 14px}.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;border-top:1px solid #e6ded3;padding:11px 0}.task:first-of-type{border-top:0}.task small{display:block;color:#8c857b;margin-top:3px}.due{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee7dc}.late{background:#f3d7d4;color:#9c3f39}.tabs{display:flex;gap:6px;margin:10px 0 14px}.tabs button{border:1px solid #d5ccbf;background:#fbf7ef;border-radius:999px;padding:8px 11px;font-size:12px}.tabs button.on{background:#171614;color:#fff}.table{background:#fbf7ef;border:1px solid #ddd4c7;border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:34px 2fr .9fr .8fr .9fr .7fr .8fr;gap:8px;align-items:center;padding:12px;border-top:1px solid #e7dfd4;font-size:12px}.row.head{background:#eee7dc;border-top:0;color:#777;font-size:10px}.row.click{cursor:pointer}.row.click:hover{background:#f2ece2}.check{width:18px;height:18px;border:1px solid #bbb;border-radius:5px;display:grid;place-items:center}.check.done{background:#171614;color:#fff}.pill{font-size:10px;border-radius:999px;padding:5px 8px;background:#e8e2d9}.pill.doing{background:#d8e6f8;color:#35649c}.pill.waiting{background:#f3e1ac;color:#80621e}.pill.done{background:#d7e6d0;color:#4c724a}.placeholder{display:grid;place-items:center;min-height:65vh}.placeholder .card{width:min(620px,80vw);padding:44px}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px}.sheet{width:min(680px,95vw);background:#fbf7ef;border-radius:22px;padding:22px}.sheet h2{font:30px Georgia,serif;margin:4px 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:11px;color:#736c62}.form input,.form select,.form textarea{width:100%;margin-top:6px;border:1px solid #d6ccbf;background:#fffaf4;border-radius:10px;padding:10px}.form textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8vw}.auth .logo{font:110px Georgia,serif;letter-spacing:-8px}.login{background:#fff8;border:1px solid #d7cdbf;border-radius:28px;padding:42px}.login h1{font:56px Georgia,serif;line-height:.95;margin:12px 0 20px}.login p{color:#71695f;line-height:1.6}.login button{width:100%;margin-top:18px;height:52px}.toast{position:fixed;right:22px;bottom:22px;background:#171614;color:#fff;padding:12px 16px;border-radius:11px;font-size:12px}@media(max-width:1000px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.row{grid-template-columns:30px 1.7fr .8fr .7fr .7fr}.row>:nth-child(5),.row>:nth-child(6){display:none}.app{grid-template-columns:150px 1fr}.main{padding:18px}.hero h1{font-size:42px}}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.metrics{grid-template-columns:1fr 1fr}.auth{grid-template-columns:1fr;padding:30px}.auth .logo{font-size:64px}.login h1{font-size:44px}}
</style></head><body><div id="root"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence,signOut}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import{getFirestore,collection,onSnapshot,doc,setDoc}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDB7PYHhy3r4f9s4JifyWJA5PKWXqazids',authDomain:'dale-life-tracker.firebaseapp.com',projectId:'dale-life-tracker',storageBucket:'dale-life-tracker.firebasestorage.app',messagingSenderId:'722368860941',appId:'1:722368860941:web:574c7741fb20f2f6ccd644',measurementId:'G-9WWYKD3HWW'};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);setPersistence(auth,browserLocalPersistence);
let user=null,tasks=[],page='home',tab='all',search='',unsub=null;const root=document.querySelector('#root');
const iso=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},dd=d=>Math.round((new Date(d+'T00:00:00')-new Date(iso()+'T00:00:00'))/86400000),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function due(t){if(t.status==='done')return'Done';let d=dd(t.due);return d===0?'Today':d===1?'Tomorrow':d<0?`${-d}d overdue`:`D-${d}`};function toast(x){let e=document.createElement('div');e.className='toast';e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function subscribe(){if(unsub)unsub();unsub=onSnapshot(collection(db,'users',user.uid,'tasks'),s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.receivedAt||'').localeCompare(a.receivedAt||''));render()},e=>toast('Sync error: '+e.message))}
onAuthStateChanged(auth,u=>{user=u;if(u)subscribe();else{tasks=[];if(unsub)unsub();render()}});
async function login(){let p=new GoogleAuthProvider();await signInWithPopup(auth,p)};async function save(t){await setDoc(doc(db,'users',user.uid,'tasks',t.id),{title:t.title,requester:t.requester,channel:t.channel,project:t.project,category:t.category,priority:t.priority,due:t.due,receivedAt:t.receivedAt,status:t.status,note:t.note||'',completedAt:t.completedAt||null},{merge:true})}
function side(){return`<aside class="side"><div class="brand">MY OS</div><div class="nav">${[['home','Home'],['work','Work'],['life','Life'],['time','Time'],['money','Money']].map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="me">${esc(user?.email||'')}</div></aside>`}
function top(){return`<div class="top"><input id="search" class="search" placeholder="Search tasks, projects, people..." value="${esc(search)}"><span class="sync">● Cloud synced</span><button id="logout" class="ghost btn">Sign out</button></div>`}
function home(){let open=tasks.filter(x=>x.status!=='done'),today=open.filter(x=>x.due===iso()),doing=open.filter(x=>x.status==='doing'),done=tasks.filter(x=>x.status==='done').length,rate=tasks.length?Math.round(done/tasks.length*100):0,late=open.filter(x=>dd(x.due)<0);return`<section><div class="hero"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, Dale</h1><p>오늘 해야 할 것과 이번 주 흐름을 한눈에 봅니다.</p></div><button class="btn" id="add">＋ Quick add</button></div><div class="metrics"><div class="m y">Open work<b>${open.length}</b></div><div class="m p">Due today<b>${today.length}</b></div><div class="m g">In progress<b>${doing.length}</b></div><div class="m b">Completion<b>${rate}%</b></div></div><div class="grid"><div class="card"><h3>Priority work</h3>${open.slice(0,6).map(t=>`<div class="task"><span class="check" data-done="${t.id}"></span><div><b>${esc(t.title)}</b><small>${esc(t.project)} · ${esc(t.requester)}</small></div><span class="due ${dd(t.due)<0?'late':''}">${due(t)}</span></div>`).join('')||'<p>No open tasks.</p>'}</div><div class="card"><h3>Weekly signal</h3><p>Overdue tasks <b>${late.length}</b></p><p>Waiting <b>${open.filter(x=>x.status==='waiting').length}</b></p><p>Completed <b>${done}</b></p><p style="color:#777;line-height:1.6">업무가 쌓이면 여기에서 지난주 대비 변화와 마감 준수율을 보여주게 됩니다.</p></div></div></section>`}
function filtered(){return tasks.filter(t=>{let ok=tab==='all'||(tab==='overdue'?t.status!=='done'&&dd(t.due)<0:t.status===tab);let q=search.toLowerCase();return ok&&(!q||[t.title,t.requester,t.project,t.channel].join(' ').toLowerCase().includes(q))})}
function work(){let list=filtered();return`<section><div class="hero"><div><h1>Work</h1><p>받은 업무를 기록하고, 마감과 상태를 추적합니다.</p></div><button class="btn" id="add">＋ New task</button></div><div class="tabs">${[['all','All'],['todo','To do'],['doing','In progress'],['waiting','Waiting'],['overdue','Overdue'],['done','Done']].map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</div><div class="table"><div class="row head"><div></div><div>Task</div><div>Requester</div><div>Channel</div><div>Project</div><div>Due</div><div>Status</div></div>${list.map(t=>`<div class="row click"><div class="check ${t.status==='done'?'done':''}" data-done="${t.id}">${t.status==='done'?'✓':''}</div><div><b>${esc(t.title)}</b><small>${esc(t.category)}</small></div><div>${esc(t.requester)}</div><div>${esc(t.channel)}</div><div>${esc(t.project)}</div><div class="${dd(t.due)<0&&t.status!=='done'?'late':''}">${due(t)}</div><div><select data-status="${t.id}" class="pill ${t.status}"><option value="todo" ${t.status==='todo'?'selected':''}>To do</option><option value="doing" ${t.status==='doing'?'selected':''}>In progress</option><option value="waiting" ${t.status==='waiting'?'selected':''}>Waiting</option><option value="done" ${t.status==='done'?'selected':''}>Done</option></select></div></div>`).join('')||'<div style="padding:30px;color:#888">No tasks in this view.</div>'}</div></section>`}
function placeholder(n){return`<div class="placeholder"><div class="card"><small>NEXT MODULE</small><h1 style="font:48px Georgia,serif">${n}</h1><p>이 영역은 WORK 검증 후 다음 단계에서 연결합니다.</p></div></div>`}
function modal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><form class="sheet" id="form"><h2>New work task</h2><div class="form"><label class="full">Task<input name="title" required autofocus></label><label>Requester<input name="requester"></label><label>Channel<select name="channel"><option>Slack</option><option>Email</option><option>Meeting</option><option>Kakao</option><option>Call</option><option>Other</option></select></label><label>Project<input name="project"></label><label>Category<input name="category" value="기타"></label><label>Due<input type="date" name="due" value="${iso()}"></label><label>Priority<select name="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label><label class="full">Description<textarea name="note"></textarea></label></div><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Add task</button></div></form></div>`);document.querySelector('#cancel').onclick=()=>document.querySelector('#modal').remove();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),t={id:'t-'+Date.now(),title:f.get('title').trim(),requester:f.get('requester').trim(),channel:f.get('channel'),project:f.get('project').trim(),category:f.get('category').trim()||'기타',priority:f.get('priority'),due:f.get('due'),receivedAt:new Date().toISOString(),status:'todo',note:f.get('note').trim(),completedAt:null};await save(t);document.querySelector('#modal').remove();page='work';render()}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelector('#logout')?.addEventListener('click',()=>signOut(auth));document.querySelector('#add')?.addEventListener('click',modal);document.querySelector('#search')?.addEventListener('input',e=>{search=e.target.value;if(page==='work')render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{let t=tasks.find(x=>x.id===b.dataset.done);if(t){t={...t,status:t.status==='done'?'todo':'done',completedAt:t.status==='done'?null:new Date().toISOString()};await save(t)}});document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{let t=tasks.find(x=>x.id===s.dataset.status);if(t)await save({...t,status:s.value,completedAt:s.value==='done'?new Date().toISOString():null})})}
function render(){if(!user){root.innerHTML=`<div class="auth"><div class="logo">MY OS</div><div class="login"><small>PERSONAL OPERATING SYSTEM</small><h1>Your work.<br>Your life.<br>One place.</h1><p>Google 계정으로 로그인하면 업무 데이터가 Firestore에 저장되고 PC와 모바일에서 같은 내용을 볼 수 있습니다.</p><button class="btn" id="login">Continue with Google</button></div></div>`;document.querySelector('#login').onclick=login;return}let c=page==='home'?home():page==='work'?work():placeholder(page[0].toUpperCase()+page.slice(1));root.innerHTML=`<div class="app">${side()}<main class="main">${top()}${c}</main></div>`;bind()}
render();
</script></body></html>
