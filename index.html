<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Tracker</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
*{box-sizing:border-box}
:root{
  --bg:#f3ecdf;--panel:#fbf7ef;--line:#ddd4c7;--text:#171614;--muted:#7c756b;
  --side:#11110f;--yellow:#f6d981;--pink:#edb8cc;--green:#c6d6a9;--blue:#bdd2ef;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
.brand{font-size:25px;font-weight:800;letter-spacing:-.04em;margin:4px 10px 28px;cursor:pointer}
.nav button{width:100%;border:0;background:transparent;color:#bdbab4;padding:11px 12px;border-radius:12px;text-align:left;margin:3px 0}
.nav button.on,.nav button:hover{background:#2b2a27;color:#fff}
.me{margin-top:auto;padding:12px;border-top:1px solid #333;font-size:12px;color:#aaa;display:grid;gap:8px}
.me button{border:0;background:transparent;color:#777;text-align:left;padding:0}
.me button:hover{color:#fff}
.main{padding:22px 28px}
.top{display:flex;align-items:center;gap:14px}
.search{flex:1;max-width:520px;border:1px solid #d8d0c4;background:var(--panel);border-radius:12px;padding:11px 13px}
.sync{margin-left:auto;font-size:11px;color:#777}
.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:38px 0 18px}
.hero h1{font-size:46px;line-height:1.05;margin:0;letter-spacing:-.045em}
.hero p{margin:10px 0 0;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:11px 16px;background:var(--text);color:#fff}
.btn.secondary{background:transparent;border:1px solid #cfc5b7;color:var(--text)}
.btn.danger{background:#8f3f39}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.m{border-radius:18px;padding:18px;min-height:110px}
.m b{font-size:34px;display:block;margin-top:8px;letter-spacing:-.04em}
.y{background:var(--yellow)}.p{background:var(--pink)}.g{background:var(--green)}.b{background:var(--blue)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:20px;margin:0 0 14px;letter-spacing:-.03em}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;border-top:1px solid #e6ded3;padding:11px 0}
.task:first-of-type{border-top:0}
.task small{display:block;color:#8c857b;margin-top:3px}
.due{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee7dc}
.late{background:#f3d7d4;color:#9c3f39}
.tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid #d5ccbf;background:var(--panel);border-radius:999px;padding:8px 11px;font-size:12px}
.tabs button.on{background:var(--text);color:#fff}
.table{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(220px,2fr) .9fr .8fr .9fr .8fr .95fr 64px;gap:8px;align-items:center;padding:12px;border-top:1px solid #e7dfd4;font-size:12px}
.row.head{background:#eee7dc;border-top:0;color:#777;font-size:10px}
.row.data:hover{background:#f2ece2}
.row-title{cursor:pointer}
.row-title b{font-size:13px}
.row-title small{display:block;color:#8c857b;margin-top:3px}
.check{width:18px;height:18px;border:1px solid #bbb;border-radius:5px;display:grid;place-items:center;cursor:pointer}
.check.done{background:var(--text);color:#fff}
.pill{font-size:10px;border-radius:999px;padding:6px 8px;background:#e8e2d9;border:0}
.pill.doing{background:#d8e6f8;color:#35649c}.pill.waiting{background:#f3e1ac;color:#80621e}.pill.done{background:#d7e6d0;color:#4c724a}
.linkbtn{border:0;background:transparent;color:#7e756a;font-size:11px;padding:5px}
.linkbtn:hover{color:#111}
.trash-actions{display:flex;gap:4px}
.placeholder{display:grid;place-items:center;min-height:65vh}
.placeholder .card{width:min(620px,80vw);padding:44px}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}
.sheet{width:min(680px,95vw);max-height:90vh;overflow:auto;background:var(--panel);border-radius:22px;padding:22px}
.sheet h2{font-size:26px;margin:4px 0 18px;letter-spacing:-.035em}
.quickline{display:grid;grid-template-columns:1fr 150px;gap:10px;margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{font-size:11px;color:#736c62}
.form input,.form select,.form textarea,.quickline input{width:100%;margin-top:6px;border:1px solid #d6ccbf;background:#fffaf4;border-radius:10px;padding:10px}
.form textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}
details{border-top:1px solid #e6ded3;margin-top:14px;padding-top:14px}
summary{cursor:pointer;font-size:12px;color:#6f675d}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.actions-right{display:flex;gap:8px}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8vw}
.auth .logo{font-size:72px;font-weight:800;letter-spacing:-.06em}
.login{background:#fff8;border:1px solid #d7cdbf;border-radius:28px;padding:42px}
.login h1{font-size:50px;line-height:1;margin:12px 0 20px;letter-spacing:-.05em}
.login p{color:#71695f;line-height:1.6}
.login button{width:100%;margin-top:18px;height:52px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:#fff;padding:12px 16px;border-radius:11px;font-size:12px;z-index:40}
.helper{font-size:11px;color:#8d857a;margin-top:7px;line-height:1.5}
.empty{padding:30px;color:#888}
@media(max-width:1100px){
  .row{grid-template-columns:30px minmax(180px,1.7fr) .8fr .7fr .8fr .7fr 58px}
  .row>:nth-child(5),.row>:nth-child(7){display:none}
}
@media(max-width:1000px){
  .metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}
  .app{grid-template-columns:150px 1fr}.main{padding:18px}.hero h1{font-size:38px}
}
@media(max-width:720px){
  .app{grid-template-columns:1fr}.side{display:none}.metrics{grid-template-columns:1fr 1fr}
  .auth{grid-template-columns:1fr;padding:30px}.auth .logo{font-size:54px}.login h1{font-size:40px}
  .quickline{grid-template-columns:1fr}
}

.life-top-actions{display:flex;gap:8px;flex-wrap:wrap}
.life-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.life-wide{grid-column:1/-1}
.life-item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #e6ded3}
.life-item:first-of-type{border-top:0}
.life-title{cursor:pointer}
.life-title b{font-size:13px}
.life-title small{display:block;color:#8c857b;margin-top:3px}
.area{font-size:10px;padding:5px 8px;border-radius:999px;background:#eee7dc;white-space:nowrap}
.habit-row{display:grid;grid-template-columns:minmax(130px,1fr) repeat(7,32px) 48px 28px;gap:6px;align-items:center;padding:10px 0;border-top:1px solid #e6ded3}
.habit-row:first-of-type{border-top:0}
.habit-day{height:30px;border:1px solid #d2c8ba;background:#fffaf4;border-radius:9px;font-size:10px}
.habit-day.on{background:#171614;color:#fff;border-color:#171614}
.habit-head{font-size:10px;color:#8c857b;text-align:center}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal-card{border:1px solid #e2d9cd;background:#fffaf4;border-radius:14px;padding:14px}
.goal-card h4{margin:8px 0 6px;font-size:14px;cursor:pointer}
.goal-card small{color:#8c857b}
.progress{height:7px;background:#e8e0d5;border-radius:999px;margin-top:12px;overflow:hidden}
.progress i{display:block;height:100%;background:#171614;border-radius:999px}
.life-trash-list{display:grid;gap:8px}
.trash-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #e6ded3}
.trash-line:first-child{border-top:0}
.mini-actions{display:flex;gap:5px}
@media(max-width:1000px){.life-grid{grid-template-columns:1fr}.goal-grid{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.goal-grid{grid-template-columns:1fr}.habit-row{grid-template-columns:1fr repeat(7,28px)}.habit-row>:nth-last-child(-n+2){display:none}}

/* --- DARK TONE-ON-TONE V3 --- */
:root{
  --bg:#121316;--panel:#1b1c20;--panel2:#202126;--line:#303238;--text:#f1eee7;--muted:#9d988f;
  --side:#0d0e10;--yellow:#d3c66d;--pink:#aa849d;--green:#849d78;--blue:#8299b0;
}
body{background:radial-gradient(circle at 90% 5%,#25262b 0,#17181b 26%,#121316 68%);color:var(--text)}
.side{background:rgba(10,11,13,.96);border-right:1px solid var(--line)}
.brand{font-size:25px;color:#f5f0e7}
.nav button{color:#aaa59d;display:flex;align-items:center;gap:10px}
.nav button.on,.nav button:hover{background:#1d1e22;border:1px solid #2e3036;color:#fff}
.main{background:transparent}
.search,.card,.table,.sheet,.login{background:linear-gradient(180deg,#1b1c20,#191a1e);border-color:var(--line);color:var(--text)}
.search::placeholder{color:#716d66}
.sync,.hero p,.helper,.task small,.row-title small,.life-title small,.goal-card small,.me{color:var(--muted)}
.btn{background:#ebe4d5;color:#121316;font-weight:650}
.btn.secondary{background:#1b1c20;border-color:#3a3c43;color:#e5dfd4}
.btn.danger{background:#8c4b4b;color:#fff}
.metrics{gap:12px}
.m{background:linear-gradient(180deg,#1c1d21,#212228)!important;border:1px solid var(--line);color:var(--text);position:relative;overflow:hidden}
.m:after{content:'';position:absolute;width:78px;height:78px;border:1px dashed rgba(255,255,255,.06);border-radius:48% 52% 46% 54%;right:-18px;bottom:-24px;transform:rotate(-13deg)}
.m b{color:#fff}
.card{box-shadow:none}
.card h3{color:#f2eee6}
.due,.area,.pill{background:#27292f;color:#c8c2b7;border:1px solid #34363d}
.late{background:#4a292b!important;color:#efb4b4!important}
.tabs button{background:#1b1c20;border-color:#35373d;color:#aaa59d}
.tabs button.on{background:#eae3d4;color:#141416;border-color:#eae3d4}
.table{overflow:hidden}
.row.head{background:#202126;color:#89857e}
.row{border-color:#2c2e34}
.row.data:hover{background:#222328}
.check{background:#141519;border-color:#555962}
.check.done{background:#eae3d4;color:#141416;border-color:#eae3d4}
.form input,.form select,.form textarea,.quickline input{background:#111216;border-color:#34363d;color:#f0ece4}
details,.life-item,.habit-row,.trash-line,.task{border-color:#2b2d32}
.habit-day{background:#17181c;border-color:#34363d;color:#aaa59d}
.habit-day.scheduled{border-color:#777169;color:#ded8cc}
.habit-day.on{background:#eae3d4;color:#151515;border-color:#eae3d4}
.habit-day.offday{opacity:.35}
.goal-card{background:#17181c;border-color:#303238}
.progress{background:#2a2c31}.progress i{background:#eae3d4}
.auth{background:radial-gradient(circle at 20% 20%,#27282d,#111216 58%)}
.login{background:#1c1d21}
.login p{color:var(--muted)}
.doodle-icon{width:22px;height:22px;display:inline-block;flex:0 0 auto;color:#d9d2c5}
.doodle-icon path,.doodle-icon circle,.doodle-icon polyline,.doodle-icon line{vector-effect:non-scaling-stroke}
.section-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.section-head h3{margin:0}
.home-duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.home-stack{display:grid;gap:14px}
.home-life-item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid #2b2d32}
.home-life-item:first-child{border-top:0}
.category-dot{width:8px;height:8px;border-radius:50%;background:#d3c66d;display:inline-block;margin-right:6px}
.schedule-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.schedule-picker label{display:grid;place-items:center;border:1px solid #34363d;border-radius:12px;background:#15161a;color:#aaa59d;padding:11px 0;cursor:pointer}
.schedule-picker label.on{background:#eae3d4;color:#141416;border-color:#eae3d4;font-weight:700}
.schedule-picker input{display:none}
@media(max-width:1000px){.home-duo{grid-template-columns:1fr}}


/* --- HIERARCHY V4 --- */
:root{--work-accent:#d4c36a;--life-accent:#89a47d}
.main{padding:26px 30px}
.hero{margin:42px 0 20px}
.card,.table,.m{box-shadow:0 1px 0 rgba(255,255,255,.025),0 14px 40px rgba(0,0,0,.14)}
.card{background:#1b1c20}
.card.work-zone{border-color:#34332b;position:relative}
.card.work-zone:before{content:'';position:absolute;left:0;top:22px;bottom:22px;width:3px;border-radius:99px;background:var(--work-accent)}
.card.life-zone{border-color:#30392f;position:relative}
.card.life-zone:before{content:'';position:absolute;left:0;top:22px;bottom:22px;width:3px;border-radius:99px;background:var(--life-accent)}
.card.habit-zone{background:#202126;border-color:#34363c}
.card.goal-zone{background:#18191d;border-color:#34363c}
.m{background:#1b1c20!important;border-color:#303238}
.m.work-metric{border-top:3px solid var(--work-accent)}
.m.life-metric{border-top:3px solid var(--life-accent)}
.home-duo{gap:16px}
.life-grid{gap:16px}
.section-head{padding-bottom:10px;border-bottom:1px solid #2c2e34}
.work-zone .section-head{color:#ded39a}
.life-zone .section-head{color:#b0c5a7}
.habit-zone .section-head,.goal-zone .section-head{color:#d8d2c7}
.goal-card{background:#202126;border-color:#35373e;padding:16px}
.goal-card:hover{border-color:#464950}
.goal-link-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.goal-link-meta span{font-size:10px;padding:5px 8px;border-radius:999px;background:#272930;border:1px solid #363940;color:#bbb5aa}
.parent-path{display:flex;align-items:center;gap:5px;color:#918c83;font-size:10px;margin-top:4px;flex-wrap:wrap}
.parent-path b{color:#c8c2b8;font-weight:550}
.form-section{background:#15161a;border:1px solid #2f3137;border-radius:16px;padding:13px}
.form-section-title{font-size:11px;font-weight:700;color:#c9c3b8;margin-bottom:9px}
@media(max-width:720px){.main{padding:16px}.card.work-zone:before,.card.life-zone:before{top:16px;bottom:16px}}


/* --- UI REFINEMENT V5 --- */
:root{
  --sky-1:#202a33;--sky-2:#263441;--sky-3:#314352;
  --gray-1:#1d1f23;--gray-2:#24262b;--gray-3:#303239;
}
.app{grid-template-columns:190px 1fr;transition:grid-template-columns .18s ease}
.app.side-collapsed{grid-template-columns:68px 1fr}
.side{padding:16px 12px}
.side-top{display:flex;align-items:center;gap:6px;margin-bottom:22px}
.brand{margin:0;flex:1;font-size:23px;white-space:nowrap;overflow:hidden}
.side-toggle{width:34px;height:34px;border:1px solid #303239;background:#17181c;color:#c5c0b6;border-radius:7px;display:grid;place-items:center}
.side.collapsed .brand-text,.side.collapsed .nav-label,.side.collapsed .logout-label{display:none}
.side.collapsed .brand{font-size:14px;text-align:center}
.side.collapsed .nav button{justify-content:center;padding:10px 6px}
.side.collapsed .me{padding:12px 0;text-align:center}
.side.collapsed .me button{justify-content:center}
.me{overflow:hidden}
.me button{display:flex;align-items:center;gap:8px;color:#8e8a82}
.card,.table,.m{border-radius:10px}
.goal-card{border-radius:8px}
.btn{border-radius:8px}
.btn.secondary,.btn.danger{border-radius:8px}
.search{border-radius:8px}
.nav button{border-radius:7px}
.sheet{border-radius:12px}
.form input,.form select,.form textarea,.quickline input{border-radius:7px}
.tabs button,.due,.area,.pill{border-radius:7px}
.check{border-radius:4px}
.habit-day{border-radius:6px}
.schedule-picker label{border-radius:7px}
.progress{border-radius:3px}
.doodle-mark{width:31px;height:31px;display:inline-grid;place-items:center;border-radius:7px;flex:0 0 auto;border:1px solid rgba(255,255,255,.05)}
.doodle-mark.sky{background:#283743;color:#b7c7d2}
.doodle-mark.gray{background:#292b30;color:#c2beb6}
.doodle-icon{width:20px;height:20px;transform:rotate(-2deg)}
.nav .doodle-mark{width:28px;height:28px}
.m.work-metric{background:linear-gradient(145deg,#222930,#1d2228)!important;border-top:0;border-left:3px solid #63798c}
.m.life-metric{background:linear-gradient(145deg,#25272b,#202226)!important;border-top:0;border-left:3px solid #69737d}
.work-zone{background:linear-gradient(145deg,#202831,#1b2026)!important}
.life-zone{background:linear-gradient(145deg,#24272b,#1e2024)!important}
.habit-zone{background:linear-gradient(145deg,#22252a,#1d1f23)!important}
.goal-zone{background:linear-gradient(145deg,#1f2226,#1a1c20)!important}
.card.work-zone:before,.card.life-zone:before{display:none}
.section-head{border-bottom-color:#34363c}
.calendar-field{display:grid;gap:6px}
.calendar-field>span{font-size:11px;color:#8f8a81}
.date-button{width:100%;text-align:left;border:1px solid #34363d;background:#111216;color:#f0ece4;border-radius:7px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.date-button:after{content:'▦';color:#7f8b94}
.calendar-layer{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:grid;place-items:center;padding:20px}
.calendar-pop{width:330px;background:#191a1e;border:1px solid #3b3d44;border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.38)}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calendar-head button{border:1px solid #34363d;background:#22242a;color:#d7d2c8;width:32px;height:30px;border-radius:6px}
.calendar-title{font-weight:700}
.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calendar-week div{font-size:10px;text-align:center;color:#7e7a73;padding:4px 0}
.calendar-day{height:36px;border:0;background:#202126;color:#c5c0b7;border-radius:5px}
.calendar-day:hover{background:#2b333b}
.calendar-day.muted{opacity:.28}
.calendar-day.selected{background:#526877;color:#fff}
.calendar-day.today{outline:1px solid #6f7f8b}
.date-inline{font-size:10px;color:#9aa2a9;display:block;margin-top:3px}
@media(max-width:760px){.app.side-collapsed{grid-template-columns:1fr}}

</style>

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,browserLocalPersistence);

let user=null,tasks=[],page='home',tab='active',search='',unsub=null,sideCollapsed=localStorage.getItem('lt_sidebar')==='collapsed';

const iso=(d=new Date())=>new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const dd=(d)=>Math.round((new Date(d+'T00:00:00')-new Date(iso()+'T00:00:00'))/86400000);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>iso();

function startOfWeek(){
  const d=new Date(); const day=(d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d;
}
function endOfWeek(){const d=startOfWeek();d.setDate(d.getDate()+6);return d}
function inThisWeek(dateStr){
  if(!dateStr)return false;
  const d=new Date(dateStr+'T00:00:00'); return d>=startOfWeek()&&d<=endOfWeek();
}
function isTodayCompleted(t){return t.status==='done'&&t.completedAt&&iso(new Date(t.completedAt))===todayStr()}

function weekDates(){
  const d=startOfWeek(),arr=[]; for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);arr.push(iso(x))} return arr;
}

function weekdayLabel(dateStr){return ['일','월','화','수','목','금','토'][new Date(dateStr+'T00:00:00').getDay()]}
function formatDateKo(dateStr,year=false){
  if(!dateStr)return '날짜 선택';
  const d=new Date(dateStr+'T00:00:00');
  const prefix=year?d.getFullYear()+'.':'';
  return prefix+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' ('+weekdayLabel(dateStr)+')';
}

}

  form?.querySelectorAll('[data-calendar-field]').forEach(btn=>btn.addEventListener('click',()=>{
    const input=form.querySelector('[name="'+btn.dataset.calendarField+'"]');
    openCalendar(input?.value||todayStr(),value=>{input.value=value;btn.textContent=formatDateKo(value,true)});

function openCalendar(current,onSelect){
  const base=current?new Date(current+'T00:00:00'):new Date();
  const layer=document.createElement('div');layer.className='calendar-layer';layer.id='calendarLayer';document.body.appendChild(layer);
  let y=base.getFullYear(),m=base.getMonth();
  const draw=()=>{
    const first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();
    const prevLast=new Date(y,m,0).getDate(),cells=[];
    for(let i=0;i<42;i++){
      let day,cy=y,cm=m,muted=false;
      if(i<start){day=prevLast-start+i+1;cm=m-1;muted=true;if(cm<0){cm=11;cy--}}
      else if(i>=start+last){day=i-start-last+1;cm=m+1;muted=true;if(cm>11){cm=0;cy++}}
      else day=i-start+1;
      const val=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      cells.push(`<button class="calendar-day ${muted?'muted':''} ${val===current?'selected':''} ${val===todayStr()?'today':''}" data-date="${val}">${day}</button>`);
    }
    layer.innerHTML=`<div class="calendar-pop"><div class="calendar-head"><button type="button" data-cal-prev>‹</button><div class="calendar-title">${y}년 ${m+1}월</div><button type="button" data-cal-next>›</button></div><div class="calendar-week">${['월','화','수','목','금','토','일'].map(x=>'<div>'+x+'</div>').join('')}</div><div class="calendar-days">${cells.join('')}</div></div>`;
    layer.querySelector('[data-cal-prev]').onclick=()=>{m--;if(m<0){m=11;y--}draw()};
    layer.querySelector('[data-cal-next]').onclick=()=>{m++;if(m>11){m=0;y++}draw()};
    layer.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{onSelect(b.dataset.date);layer.remove()});
    layer.onclick=e=>{if(e.target===layer)layer.remove()};
  };
  draw();
}

function parseDueToken(token){
  if(!token)return todayStr();
  const t=token.trim();
  const now=new Date();
  if(t==='오늘')return todayStr();
  if(t==='내일'){now.setDate(now.getDate()+1);return iso(now)}
  if(t==='모레'){now.setDate(now.getDate()+2);return iso(now)}
  const md=t.match(/^(\d{1,2})[./-](\d{1,2})$/);
  if(md){const d=new Date(now.getFullYear(),Number(md[1])-1,Number(md[2]));return iso(d)}
  const map={월:1,화:2,수:3,목:4,금:5,토:6,일:0};
  const k=t.replace('요일','').slice(0,1);
  if(map[k]!==undefined){
    const cur=now.getDay(),target=map[k]; let diff=(target-cur+7)%7; if(diff===0)diff=7;
    now.setDate(now.getDate()+diff);return iso(now);
  }
  return todayStr();
}
function parseQuick(text){
  const p=text.split('/').map(x=>x.trim());
  return {title:p[0]||'',due:parseDueToken(p[1]),requester:p[2]||'',channel:p[3]||''};
}

function habitRow(h,dates){
  const plan=h.repeatDays||[1,1,1,1,1,1,1];
  const count=dates.filter((d,i)=>plan[i]&&h.logs?.[d]).length;
  const target=plan.filter(Boolean).length;
  const g=goals().find(x=>x.id===h.goalId);
  return `<div class="habit-row">
    <div class="life-title" data-habit-edit="${h.id}"><b>${esc(h.title)}</b><small>매주 반복 · ${plan.map((v,i)=>v?['월','화','수','목','금','토','일'][i]:'').filter(Boolean).join(' ')||'요일 미선택'}</small>
      ${g?`<div class="parent-path"><b>${esc(g.title)}</b> → Habit</div>`:''}
    </div>
    ${dates.map((d,i)=>`<button class="habit-day ${plan[i]?'scheduled':'offday'} ${h.logs?.[d]?'on':''}" ${plan[i]?`data-habit="${h.id}" data-date="${d}"`:'disabled'}>${h.logs?.[d]?'✓':['월','화','수','목','금','토','일'][i]}</button>`).join('')}
    <div style="font-size:11px;text-align:center">${count}/${target}</div>
    <button class="linkbtn" data-life-trash="${h.id}">삭제</button>
  </div>`;
}
function goalCard(g){
  const linkedTodos=lifeTodos().filter(t=>!t.deletedAt&&t.goalId===g.id);
  const linkedHabits=habits().filter(h=>!h.deletedAt&&h.goalId===g.id);
  const todoRate=linkedTodos.length?linkedTodos.filter(t=>t.status==='done').length/linkedTodos.length:null;
  const dates=weekDates();
  const habitRates=linkedHabits.map(h=>{
    const plan=h.repeatDays||[1,1,1,1,1,1,1],target=plan.filter(Boolean).length;
    if(!target)return null;
    const done=dates.filter((d,i)=>plan[i]&&h.logs?.[d]).length;
    return done/target;
  }).filter(v=>v!==null);
  const habitRate=habitRates.length?habitRates.reduce((a,b)=>a+b,0)/habitRates.length:null;
  const rates=[todoRate,habitRate].filter(v=>v!==null);
  const progress=rates.length?Math.round(rates.reduce((a,b)=>a+b,0)/rates.length*100):Number(g.progress)||0;
  return `<div class="goal-card">
    <span class="area">${esc(g.area||'Other · 기타')}</span>
    <h4 data-goal-edit="${g.id}">${esc(g.title)}</h4>
    <small>${g.targetDate?'목표 '+formatDateKo(g.targetDate,true):'목표일 없음'}</small>
    <div class="goal-link-meta"><span>Habit ${linkedHabits.length}</span><span>Todo ${linkedTodos.length}</span><span>자동 진행 ${rates.length?'ON':'OFF'}</span></div>
    <div class="progress"><i style="width:${Math.max(0,Math.min(100,progress))}%"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px"><small>${progress}%</small><button class="linkbtn" data-life-trash="${g.id}">삭제</button></div>
  </div>`;
}

  document.querySelector('#search')?.addEventListener('input',e=>{search=e.target.value;if(page==='work')render()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{const t=tasks.find(x=>x.id===b.dataset.done);if(t){const next=t.status==='done'?'todo':'done';await save({...t,status:next,completedAt:next==='done'?new Date().toISOString():null})}});
  document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const t=tasks.find(x=>x.id===s.dataset.status);if(t)await save({...t,status:s.value,completedAt:s.value==='done'?(t.completedAt||new Date().toISOString()):null})});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>x.id===b.dataset.edit);if(t)taskModal(t)});
  document.querySelectorAll('[data-trash]').forEach(b=>b.onclick=()=>moveTrash(b.dataset.trash));
  document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreTask(b.dataset.restore));
  document.querySelectorAll('[data-harddelete]').forEach(b=>b.onclick=()=>hardDelete(b.dataset.harddelete));
  document.querySelector('#addPersonal')?.addEventListener('click',()=>personalModal());
  document.querySelector('#addHabit')?.addEventListener('click',()=>habitModal());
  document.querySelector('#addGoal')?.addEventListener('click',()=>goalModal());
  document.querySelector('#lifeTrash')?.addEventListener('click',lifeTrashModal);
  document.querySelectorAll('[data-personal-done]').forEach(b=>b.onclick=async()=>{const t=tasks.find(x=>x.id===b.dataset.personalDone);if(t){const next=t.status==='done'?'todo':'done';await save({...t,status:next,completedAt:next==='done'?new Date().toISOString():null})}});
  document.querySelectorAll('[data-personal-edit]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>x.id===b.dataset.personalEdit);if(t)personalModal(t)});
  document.querySelectorAll('[data-habit]').forEach(b=>b.onclick=()=>toggleHabit(b.dataset.habit,b.dataset.date));
  document.querySelectorAll('[data-habit-edit]').forEach(b=>b.onclick=()=>{const h=tasks.find(x=>x.id===b.dataset.habitEdit);if(h)habitModal(h)});
  document.querySelectorAll('[data-goal-edit]').forEach(b=>b.onclick=()=>{const g=tasks.find(x=>x.id===b.dataset.goalEdit);if(g)goalModal(g)});
  document.querySelectorAll('[data-life-trash]').forEach(b=>b.onclick=()=>moveLifeTrash(b.dataset.lifeTrash));
}
function render(){
  if(!user){
    root.innerHTML=`<div class="auth"><div class="logo">Life Tracker</div><div class="login"><small>PERSONAL OPERATING SYSTEM</small><h1>일과 삶을<br>한 곳에서.</h1><p>업무, 개인 할 일, 시간, 소비를 하나의 대시보드에서 기록하고 관리합니다.</p><button class="btn" id="login">Google로 계속하기</button></div></div>`;
    document.querySelector('#login').onclick=login;return;
  }
  const c=page==='home'?home():page==='work'?work():page==='life'?life():placeholder(page==='finance'?'Finance':page[0].toUpperCase()+page.slice(1));
  root.innerHTML=`<div class="app ${sideCollapsed?'side-collapsed':''}">${side()}<main class="main">${top()}${c}</main></div>`;bind();
}
render();
</script>
</body>
</html>
